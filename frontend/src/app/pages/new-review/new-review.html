<div class="max-w-4xl mx-auto mt-12 animate-fade-in px-4">
  <div class="bg-editor-panel p-8 rounded-xl border border-editor-border shadow-2xl">
    
    <div class="mb-8 border-b border-editor-border pb-4">
      <h2 class="text-2xl font-mono text-gray-100 font-bold">Start New Review</h2>
      <p class="text-editor-muted mt-2 text-sm">
        Paste your code below. Our pipeline will run static analysis, secret scanning, and AI reasoning asynchronously.
      </p>
    </div>

    <div class="relative mb-6 group">
      <div class="absolute -inset-0.5 bg-gradient-to-r from-accent-primary to-purple-600 rounded-lg blur opacity-0 group-hover:opacity-20 transition duration-500"></div>
      <textarea 
        [(ngModel)]="codePayload"
        rows="14" 
        class="relative w-full bg-[#0d1117] border border-editor-border rounded-lg p-5 font-mono text-sm text-[#c9d1d9] focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary resize-y shadow-inner custom-scrollbar"
        placeholder="# Paste your code here to begin analysis...&#10;&#10;def analyze_code():&#10;    pass">
      </textarea>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2 text-sm text-editor-muted bg-[#0d1117] px-4 py-2 rounded-lg border border-editor-border">
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-status-success opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-status-success"></span>
        </span>
        Local Inference Engine Active
      </div>
      
      <button 
        (click)="submitReview()"
        [disabled]="isSubmitting || !codePayload.trim()"
        class="w-full sm:w-auto px-8 py-3 bg-accent-primary text-white font-bold rounded-lg hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-[0_0_15px_rgba(47,129,247,0.3)] hover:shadow-[0_0_25px_rgba(47,129,247,0.5)]">
        {{ isSubmitting ? 'Queueing Job...' : 'Analyze Code' }}
      </button>
    </div>

    <div *ngIf="errorMessage" class="mt-6 p-4 bg-status-critical/10 border border-status-critical text-status-critical rounded-lg text-sm flex items-center gap-3">
      <span class="text-xl">⚠️</span> {{ errorMessage }}
    </div>
  </div>
</div>
